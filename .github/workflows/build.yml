name: Build module ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read module version
        id: meta
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build module ZIP
        run: |
          mkdir -p dist
          cd module
          zip -r "../dist/wallet-card-audit-v${{ steps.meta.outputs.version }}.zip" .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallet-card-audit-v${{ steps.meta.outputs.version }}
          path: dist/*.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Wallet Card Audit v${{ steps.meta.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
