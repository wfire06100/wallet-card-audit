name: Build module ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          for f in module/*.sh; do sh -n "$f" || exit 1; done
          node --check module/webroot/app.js
      - name: Package
        run: |
          mkdir -p dist
          cd module
          zip -r ../dist/wallet-card-audit-v0.5.1.zip . -x 'webroot/data/*'
          unzip -t ../dist/wallet-card-audit-v0.5.1.zip
          cd ..
          sha256sum dist/*.zip > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-card-audit-v0.5.1
          path: dist/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.1
          name: Wallet Card Audit v0.5.1
          files: dist/*
          generate_release_notes: true
