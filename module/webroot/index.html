<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallet Card Audit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Wallet Card Audit</h1>
<p class="muted">Audit local en lecture seule. La capture automatique ne fonctionne que lorsque Google Wallet est au premier plan.</p>
<section class="card controls">
<h2>Controles</h2>
<div class="buttons">
<button id="start">Demarrer</button>
<button id="stop">Arreter</button>
<button id="auto-on">Auto ON</button>
<button id="auto-off">Auto OFF</button>
<button id="refresh">Actualiser</button>
</div>
<p id="status" class="muted">Statut inconnu.</p>
</section>
<section id="summary" class="card"><h2>Resultat</h2><p id="outcome">Aucun audit disponible.</p></section>
<section id="cards"></section>
<p class="muted">Les correspondances sont des indices heuristiques, pas des causes prouvees.</p>
</main>
<script src="app.js"></script>
</body>
</html>
